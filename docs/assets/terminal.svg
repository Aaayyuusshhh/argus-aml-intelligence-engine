<text x="640.0" y="28" text-anchor="middle" font-size="13" fill="#8a97b8" class="mono">argus — screening API — live response from the 12.2M-record index</text><g><clipPath id="tc0"><rect x="40" y="70" height="26" width="0"><animate attributeName="width" from="0" to="1200" begin="0.00s" dur="0.90s" fill="freeze"/></rect></clipPath><text class="mono" x="44" y="88" font-size="16" fill="#22d3ee" clip-path="url(#tc0)" xml:space="preserve">$ curl -s -X POST http://localhost:8002/api/screen \</text></g><g><clipPath id="tc1"><rect x="40" y="96" height="26" width="0"><animate attributeName="width" from="0" to="1200" begin="1.00s" dur="1.24s" fill="freeze"/></rect></clipPath><text class="mono" x="44" y="114" font-size="16" fill="#8a97b8" clip-path="url(#tc1)" xml:space="preserve">       -H &quot;X-API-Key: $ARGUS_KEY&quot; -H &quot;Content-Type: application/json&quot; \</text></g><g><clipPath id="tc2"><rect x="40" y="122" height="26" width="0"><animate attributeName="width" from="0" to="1200" begin="2.34s" dur="1.06s" fill="freeze"/></rect></clipPath><text class="mono" x="44" y="140" font-size="16" fill="#8a97b8" clip-path="url(#tc2)" xml:space="preserve">       -d &#x27;{&quot;name&quot;: &quot;Dawood Ibrahim&quot;, &quot;max_results&quot;: 5}&#x27; | jq</text></g><text class="mono" x="44" y="176" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">{<animate attributeName="opacity" from="0" to="1" begin="4.10s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="200" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">  &quot;query&quot;: &quot;Dawood Ibrahim&quot;,<animate attributeName="opacity" from="0" to="1" begin="4.17s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="224" font-size="16" fill="#ff7a93" opacity="0" xml:space="preserve">  &quot;risk_level&quot;: &quot;HIGH&quot;,<animate attributeName="opacity" from="0" to="1" begin="4.24s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="248" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">  &quot;total_matches&quot;: 5,<animate attributeName="opacity" from="0" to="1" begin="4.31s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="272" font-size="16" fill="#34d399" opacity="0" xml:space="preserve">  &quot;screening_time_ms&quot;: 260,<animate attributeName="opacity" from="0" to="1" begin="4.38s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="296" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">  &quot;matches&quot;: [<animate attributeName="opacity" from="0" to="1" begin="4.45s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="320" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">    { &quot;name&quot;: &quot;Dawood IBRAHIM&quot;, &quot;similarity&quot;: 1.0,<animate attributeName="opacity" from="0" to="1" begin="4.52s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="344" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">      &quot;source_agency&quot;: &quot;US Treasury OFAC&quot;,<animate attributeName="opacity" from="0" to="1" begin="4.59s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="368" font-size="16" fill="#e6ecff" opacity="0" xml:space="preserve">      &quot;source_list&quot;: &quot;Specially Designated Nationals (SDN)&quot;,<animate attributeName="opacity" from="0" to="1" begin="4.66s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="392" font-size="16" fill="#ff7a93" opacity="0" xml:space="preserve">      &quot;risk_category&quot;: &quot;sanctions&quot;,<animate attributeName="opacity" from="0" to="1" begin="4.73s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="416" font-size="16" fill="#22d3ee" opacity="0" xml:space="preserve">      &quot;source_url&quot;: &quot;https://www.opensanctions.org/entities/Q553191/&quot; },<animate attributeName="opacity" from="0" to="1" begin="4.80s" dur=".15s" fill="freeze"/></text><text class="mono" x="44" y="440" font-size="16"