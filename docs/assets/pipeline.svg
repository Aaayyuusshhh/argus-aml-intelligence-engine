<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img">
<style>text{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace} .c{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}</style>
<defs>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy="0" r=".8"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0" cy=".2" r=".7"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<clipPath id="clip"><rect width="1280" height="470" rx="18"/></clipPath>
<g clip-path="url(#clip)">
<rect width="1280" height="470" fill="#070b16"/>
<rect width="1280" height="470" fill="url(#grid)"/>
<rect width="1280" height="470" fill="url(#glowA)"/>
<rect width="1280" height="470" fill="url(#glowB)"/>
<text x="48" y="56" font-size="22" font-weight="800" fill="#e6ecff">How a record travels from a government website to a screening verdict</text><g class="c" style="animation-delay:0.0s"><rect x="40" y="100" width="244" height="230" rx="18" fill="#0d1426" stroke="#1c2744"/>
<text x="64" y="140" font-size="13" font-weight="800" letter-spacing="3" fill="#22d3ee">01 · INGEST</text><circle cx="70" cy="178" r="4" fill="url(#gr)"/><text x="84" y="183" font-size="14" fill="#e6ecff">1,193 registered sources</text><circle cx="70" cy="222" r="4" fill="url(#gr)"/><text x="84" y="227" font-size="14" fill="#e6ecff">HTML · PDF · JS · ASP.NET</text><circle cx="70" cy="266" r="4" fill="url(#gr)"/><text x="84" y="271" font-size="14" fill="#e6ecff">API replay · bulk dumps</text></g><path id="p0" d="M284,215 L310,215" stroke="#1c2744" stroke-width="2"/><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M284,215 L310,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.53s" repeatCount="indefinite" path="M284,215 L310,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="1.06s" repeatCount="indefinite" path="M284,215 L310,215"/></circle><g class="c" style="animation-delay:0.2s"><rect x="310" y="100" width="244" height="230" rx="18" fill="#0d1426" stroke="#1c2744"/>
<text x="334" y="140" font-size="13" font-weight="800" letter-spacing="3" fill="#22d3ee">02 · EXTRACT</text><circle cx="340" cy="178" r="4" fill="url(#gr)"/><text x="354" y="183" font-size="14" fill="#e6ecff">classify → route to engine</text><circle cx="340" cy="222" r="4" fill="url(#gr)"/><text x="354" y="227" font-size="14" fill="#e6ecff">106 bespoke scraper modules</text><circle cx="340" cy="266" r="4" fill="url(#gr)"/><text x="354" y="271" font-size="14" fill="#e6ecff">PDF tables · OCR · recipes</text></g><path id="p1" d="M554,215 L580,215" stroke="#1c2744" stroke-width="2"/><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M554,215 L580,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.53s" repeatCount="indefinite" path="M554,215 L580,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="1.06s" repeatCount="indefinite" path="M554,215 L580,215"/></circle><g class="c" style="animation-delay:0.4s"><rect x="580" y="100" width="244" height="230" rx="18" fill="#0d1426" stroke="#1c2744"/>
<text x="604" y="140" font-size="13" font-weight="800" letter-spacing="3" fill="#22d3ee">03 · RESOLVE</text><circle cx="610" cy="178" r="4" fill="url(#gr)"/><text x="624" y="183" font-size="14" fill="#e6ecff">normalise names &amp; aliases</text><circle cx="610" cy="222" r="4" fill="url(#gr)"/><text x="624" y="227" font-size="14" fill="#e6ecff">cross-source dedup</text><circle cx="610" cy="266" r="4" fill="url(#gr)"/><text x="624" y="271" font-size="14" fill="#e6ecff">entity graph · 1.82M groups</text></g><path id="p2" d="M824,215 L850,215" stroke="#1c2744" stroke-width="2"/><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M824,215 L850,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="0.53s" repeatCount="indefinite" path="M824,215 L850,215"/></circle><circle r="4" fill="#22d3ee"><animateMotion dur="1.6s" begin="1.06s" repeatCount="indefinite" path="M824,215 L850,215"/></circle><g class="c" style="animation-delay:0.6s"><rect x="850" y="100" width="244" height="230" rx="18" fill="#0d1426" stroke="#1c2744"/>
<text x="874" y="140" font-size="13" font-weight="800" letter-spacing="3" fill="#22d3ee">04 · SERVE</text><circle cx="880" cy="178" r="4" fill="url(#gr)"/><text x="894" y="183" font-size="14" fill="#e6ecff">PostgreSQL + pg_trgm</text><circle cx="880" cy="222" r="4" fill="url(#gr)"/><text x="894" y="227" font-size="14" fill="#e6ecff">FastAPI · MCP · CLI</text><circle cx="880" cy="266" r="4" fill="url(#gr)"/><text x="894" y="271" font-size="14" fill="#e6ecff">HTML / JSON reports</text></g><g class="c" style="animation-delay:.9s"><rect x="1130" y="100" width="110" height="230" rx="18" fill="url(#gr)"/>
<text x="1185" y="205" text-anchor="middle" font-size="15" font-weight="900" fill="#050814">RISK</text>
<text x="1185" y="227" text-anchor="middle" font-size="15" font-weight="900" fill="#050814">VERDICT</text></g>
<path d="M1094,215 L1130,215" stroke="#1c2744" stroke-width="2"/><circle r="4" fill="#8b5cf6"><animateMotion dur="1.2s" repeatCount="indefinite" path="M1094,215 L1130,215"/></circle>
<rect x="40" y="360" width="1200" height="70" rx="16" fill="#0b1224" stroke="#1c2744"/>
<text x="64" y="391" font-size="13" font-weight="800" letter-spacing="3" fill="#8b5cf6">CONTROL PLANE</text>
<text x="64" y="415" font-size="15" fill="#e6ecff">daily cron · per-source change detection (SHA-256) · health snapshots · anomaly alerts (Slack / email / SES) · auto-healer · RDS mirror sync</text>
</g>
<rect x=".5" y=".5" width="1279" height="469" rx="18" fill="none" stroke="#1c2744"/>
</svg>