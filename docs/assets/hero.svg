<style>text{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace} 
.sweep{transform-origin:1010px 220px;animation:rot 6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.blip{opacity:0;animation:bl 6s linear infinite}
@keyframes bl{0%{opacity:1}40%{opacity:.15}100%{opacity:0}}
.pulse{transform-origin:1010px 220px;animation:pu 2.4s ease-out infinite}
@keyframes pu{from{transform:scale(.6);opacity:1}to{transform:scale(3);opacity:0}}
.rise{animation:ri 1.1s cubic-bezier(.2,.8,.2,1) both}.rise2{animation:ri 1.1s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes ri{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ticker{animation:tk 60s linear infinite}@keyframes tk{to{transform:translateX(-50%)}}
</style>
